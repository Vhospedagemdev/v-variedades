<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Administrativo | V Variedades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">V</div>
        <h1 class="login-title">Painel Administrativo</h1>
        <p class="login-subtitle">Acesso restrito para gestão de ofertas</p>
      </div>

      {% if error %}
      <div style="background: #fee2e2; color: #dc2626; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
        <i class="fa-solid fa-circle-exclamation"></i> {{ error }}
      </div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="username">Usuário</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="ex: admin" required autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label class="form-label" for="password">Senha</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar no Painel
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem;">
        <a href="/" style="font-size: 0.82rem; color: var(--text-muted); text-decoration: none;">
          <i class="fa-solid fa-arrow-left"></i> Voltar para a vitrine pública
        </a>
      </div>
    </div>
  </div>
</body>
</html>
